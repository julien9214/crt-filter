<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 260px;
  background: #1a1a1a;
  color: #ccc;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 13px;
  padding: 16px;
}
h1 {
  font-size: 14px;
  color: #fff;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.mode-badge {
  font-size: 10px;
  font-weight: 400;
  padding: 2px 6px;
  border-radius: 3px;
  background: #333;
  color: #888;
}
.mode-badge.full { background: #1a3a1a; color: #4a4; }
.mode-badge.overlay { background: #3a3a1a; color: #aa4; }

/* Toggle */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid #333;
}
.switch {
  position: relative;
  width: 40px;
  height: 22px;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute;
  inset: 0;
  background: #444;
  border-radius: 11px;
  cursor: pointer;
  transition: background 0.2s;
}
.slider::before {
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  left: 3px;
  top: 3px;
  background: #fff;
  border-radius: 50%;
  transition: transform 0.2s;
}
.switch input:checked + .slider { background: #4a4; }
.switch input:checked + .slider::before { transform: translateX(18px); }

/* Presets */
.presets {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
}
.preset-btn {
  flex: 1;
  padding: 6px 0;
  background: #2a2a2a;
  color: #aaa;
  border: 1px solid #444;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover { background: #333; color: #fff; }
.preset-btn.active { background: #333; color: #fff; border-color: #666; }

/* Sliders */
.control {
  margin-bottom: 10px;
}
.control label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
  font-size: 11px;
  color: #999;
}
.control label span.val { color: #ccc; }
.control input[type=range] {
  width: 100%;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: #333;
  border-radius: 2px;
  outline: none;
}
.control input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  background: #888;
  border-radius: 50%;
  cursor: pointer;
}
.control input[type=range]::-webkit-slider-thumb:hover { background: #aaa; }
.control.disabled label { color: #555; }
.control.disabled input[type=range] { opacity: 0.3; pointer-events: none; }
</style>
</head>
<body>
  <h1>
    CRT Filter
    <span id="modeBadge" class="mode-badge">—</span>
  </h1>

  <div class="toggle-row">
    <span>Enabled</span>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="presets">
    <button class="preset-btn" data-preset="subtle">Subtle</button>
    <button class="preset-btn" data-preset="heavy">Heavy</button>
    <button class="preset-btn" data-preset="vhs">VHS</button>
  </div>

  <div class="control" id="ctrl-scanlines">
    <label>Scanlines <span class="val" id="val-scanlines">30</span></label>
    <input type="range" id="scanlines" min="0" max="100" value="30">
  </div>
  <div class="control" id="ctrl-curvature">
    <label>Curvature <span class="val" id="val-curvature">20</span></label>
    <input type="range" id="curvature" min="0" max="100" value="20">
  </div>
  <div class="control" id="ctrl-chromatic">
    <label>Chromatic Ab. <span class="val" id="val-chromatic">15</span></label>
    <input type="range" id="chromatic" min="0" max="100" value="15">
  </div>
  <div class="control" id="ctrl-bloom">
    <label>Bloom <span class="val" id="val-bloom">20</span></label>
    <input type="range" id="bloom" min="0" max="100" value="20">
  </div>
  <div class="control" id="ctrl-noise">
    <label>Noise <span class="val" id="val-noise">10</span></label>
    <input type="range" id="noise" min="0" max="100" value="10">
  </div>
  <div class="control" id="ctrl-flicker">
    <label>Flicker <span class="val" id="val-flicker">5</span></label>
    <input type="range" id="flicker" min="0" max="100" value="5">
  </div>

  <script src="popup.js"></script>
</body>
</html>
